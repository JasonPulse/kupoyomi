name: image

# Three of the four nodes this runs on are arm64, so a single-arch build would
# silently fail to schedule. Buildx by hand is too easy to forget.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # The removal test deletes files based on a database query, so it gets a real
    # database rather than being skipped in the one place it matters.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: kupoyomi
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d kupoyomi"
          --health-interval 5s --health-timeout 5s --health-retries 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # Tests and the client-script parse check gate the image: both catch classes of bug
      # that a running server reports as a 200.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/kupoyomi
      - run: node scripts/check-client-js.mjs
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/kupoyomi
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
